# =============================================================================
# Grafana Mimir - single instance, local filesystem storage
# =============================================================================
# `backend: filesystem` is used for blocks, ruler rules, and alertmanager
# state. Everything is stored under /data inside the container, which is
# the `mimir-data` Docker volume on the host.
#
# WARNING: filesystem backend is officially supported by Mimir but intended
# for dev / small / single-instance deployments. There is no replication and
# no object-store durability — back up the volume if you care about the data.
# =============================================================================

multitenancy_enabled: true

# -----------------------------------------------------------------------------
# Common storage - filesystem
# -----------------------------------------------------------------------------
common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/blocks

# -----------------------------------------------------------------------------
# Block storage (TSDB long-term)
# -----------------------------------------------------------------------------
blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks
  bucket_store:
    sync_dir: /data/tsdb-sync
  tsdb:
    dir: /data/tsdb
    retention_period: 24h        # ingester-local; long-term lives in /data/blocks

# -----------------------------------------------------------------------------
# Distributor
# -----------------------------------------------------------------------------
distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

# -----------------------------------------------------------------------------
# Ingester - RF=1, single replica
# -----------------------------------------------------------------------------
ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1
    final_sleep: 0s
    num_tokens: 512
    tokens_file_path: /data/tokens

# -----------------------------------------------------------------------------
# Query path
# -----------------------------------------------------------------------------
querier:
  max_concurrent: 16

frontend:
  parallelize_shardable_queries: true
  cache_results: false
  log_queries_longer_than: 10s

query_scheduler:
  max_outstanding_requests_per_tenant: 1024

store_gateway:
  sharding_ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1
    tokens_file_path: /data/store-gateway-tokens

# -----------------------------------------------------------------------------
# Compactor
# -----------------------------------------------------------------------------
compactor:
  data_dir: /data/compactor
  sharding_ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
  compaction_interval: 30m
  cleanup_interval: 15m
  block_ranges: [2h, 12h, 24h]
  deletion_delay: 12h

# -----------------------------------------------------------------------------
# Ruler - filesystem-backed
# -----------------------------------------------------------------------------
ruler:
  rule_path: /data/ruler-rules        # changed: must not overlap with /data/ruler-storage
  alertmanager_url: http://127.0.0.1:8080/alertmanager
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
  enable_api: true

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/ruler-storage

# -----------------------------------------------------------------------------
# Alertmanager - filesystem-backed
# -----------------------------------------------------------------------------
alertmanager:
  data_dir: /data/alertmanager
  external_url: http://localhost:9009/alertmanager
  sharding_ring:
    replication_factor: 1
    kvstore:
      store: memberlist

alertmanager_storage:
  backend: filesystem
  filesystem:
    dir: /data/storage/alertmanager

# -----------------------------------------------------------------------------
# Memberlist - cluster of one
# -----------------------------------------------------------------------------
memberlist:
  bind_port: 7946
  join_members: []

# -----------------------------------------------------------------------------
# Per-tenant limits
# -----------------------------------------------------------------------------
limits:
  ingestion_rate: 100000
  ingestion_burst_size: 1000000
  max_global_series_per_user: 1500000
  max_global_series_per_metric: 200000
  max_label_names_per_series: 30
  max_label_value_length: 2048

  max_query_parallelism: 240
  # max_query_length: 768h         # removed — unsupported in this Mimir version
  max_query_lookback: 8760h      # 1 year
  max_fetched_chunks_per_query: 2000000
  max_fetched_series_per_query: 100000

  compactor_blocks_retention_period: 90d

  ruler_max_rules_per_rule_group: 20
  ruler_max_rule_groups_per_tenant: 70

  cardinality_analysis_enabled: true

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------
server:
  http_listen_port: 8080
  grpc_listen_port: 9095
  log_level: info
  http_server_read_timeout: 2m
  http_server_write_timeout: 2m
  grpc_server_max_recv_msg_size: 104857600
  grpc_server_max_send_msg_size: 104857600

# -----------------------------------------------------------------------------
# Runtime config - hot-reloadable per-tenant overrides
# -----------------------------------------------------------------------------
runtime_config:
  file: /etc/mimir/runtime.yaml
  period: 10s

activity_tracker:
  filepath: /data/metrics-activity.log

usage_stats:
  enabled: false
